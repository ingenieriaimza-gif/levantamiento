name: Levanta
options:
  bundleIdPrefix: com.levanta
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.4.1"
    CURRENT_PROJECT_VERSION: "5"
targets:
  Levanta:
    type: application
    platform: iOS
    sources:
      - Levanta
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.levanta.lidar
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Levanta/Info.plist
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Levanta/Info.plist
      properties:
        CFBundleDisplayName: "3D"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSCameraUsageDescription: Levantamiento 3D usa la cámara y el sensor LiDAR para crear nubes de puntos 3D.
        UIRequiredDeviceCapabilities:
          - arkit
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
