name: Prueba de vista foto-realista (Gaussian Splatting)

on:
  push:
    branches: [main]
    paths:
      - "tools/exportar_splat.py"
      - ".github/workflows/splat.yml"
  workflow_dispatch:
    inputs:
      pasos:
        description: "pasos de entrenamiento"
        default: "1500"

jobs:
  splat:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PASOS: ${{ github.event.inputs.pasos || '1500' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Librerías y GPU por software (lavapipe)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libgomp1 mesa-vulkan-drivers vulkan-tools libvulkan1 > /dev/null
          vulkaninfo --summary | grep -E "deviceName|deviceType" || true
          python -m pip install --upgrade pip -q
          python -m pip install -r pc/requirements.txt -q
      - name: Motor (Brush 0.3.0)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir motor && cd motor
          gh release view v0.3.0 -R ArthurBrussee/brush --json assets -q '.assets[] | "\(.name) \(.size)"'
          gh release download v0.3.0 -R ArthurBrussee/brush -p '*x86_64-unknown-linux-gnu*'
          ls -la
          for f in *.tar.xz; do tar -xf "$f"; done
          find . -type f | head -20
          B=$(find . -type f -name 'brush_app*' | head -1); chmod +x "$B"; echo "BRUSH=$PWD/$B" >> $GITHUB_ENV
          "$B" --help | head -80
      - name: Escena simulada y exportación
        run: |
          mkdir -p sim && cd sim
          python -I ../tools/sintetico.py --salida paquete --cuadros 60
          python -I ../tools/procesar_rgbd.py paquete --salida res --conf 2 --lecturas 2 --sin-textura | grep -v PROGRESO | tail -3
          python -I ../tools/exportar_splat.py paquete --salida splat --nube res/nube_fusionada.ply
          ls splat splat/sparse/0; head -3 splat/sparse/0/cameras.txt; sed -n 3,4p splat/sparse/0/images.txt; wc -l splat/sparse/0/points3D.txt
      - name: Entrenar
        run: |
          cd sim
          export RUST_LOG=info
          /usr/bin/time -v timeout 100m "$BRUSH" splat --total-steps $PASOS --max-resolution 480 \
            --eval-split-every 8 --eval-every 500 --eval-save-to-disk \
            --export-every $PASOS --export-path "$PWD/salida" --export-name modelo.ply 2>&1 | grep -v "^\s*$" | tail -80
          find salida -type f | head -40; du -sh salida
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: splat-prueba
          path: |
            sim/salida
            sim/splat/sparse
          retention-days: 5
