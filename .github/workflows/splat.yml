name: Prueba de vista foto-realista (Gaussian Splatting)

on:
  push:
    branches: [main]
    paths:
      - "tools/exportar_splat.py"
      - "pc/vista_foto.py"
      - ".github/workflows/splat.yml"
  workflow_dispatch:
    inputs:
      pasos:
        description: "pasos de entrenamiento"
        default: "400"

jobs:
  splat:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      PASOS: ${{ github.event.inputs.pasos || '400' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Librerías y GPU por software (lavapipe)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libgomp1 mesa-vulkan-drivers vulkan-tools libvulkan1 > /dev/null
          vulkaninfo --summary | grep -E "deviceName|deviceType" || true
          python -m pip install --upgrade pip -q
          python -m pip install -r pc/requirements.txt -q
      - name: Escena simulada y exportación
        run: |
          mkdir -p sim/esc && cd sim
          python -I ../tools/sintetico.py --salida esc/paquete --cuadros 60
          python -I ../tools/procesar_rgbd.py esc/paquete --salida esc/resultado --conf 2 --lecturas 2 --sin-textura | grep -v PROGRESO | tail -3
          python -I ../tools/exportar_splat.py esc/paquete --salida esc/splat --nube esc/resultado/nube_fusionada.ply
      - name: Entrenar con el código del programa (descarga el motor)
        run: |
          export LEVANTA_FOTO_EXTRA="--eval-split-every 8 --eval-every $PASOS --eval-save-to-disk"
          /usr/bin/time -v timeout 100m python pc/vista_foto.py sim/esc $PASOS 480 2>&1 | grep -v -E "load_scene_img|Tuning|Saving eval" | cut -c1-200 | tail -60
          ls -la sim/esc/resultado
      - name: Publicar resultado de la prueba
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd sim/esc
          (cd splat_entrenando 2>/dev/null && zip -qr ../eval.zip . ) || true
          gh release delete prueba-splat -y --cleanup-tag 2>/dev/null || true
          gh release create prueba-splat --prerelease --title "Prueba de vista foto-realista" --notes "Resultado de la prueba automática (escena simulada)." resultado/vista_foto.ply $(ls eval.zip 2>/dev/null)
