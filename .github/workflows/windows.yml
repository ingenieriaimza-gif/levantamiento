name: Instalador Windows

on:
  push:
    branches: [main]
    paths:
      - "pc/**"
      - "tools/**"
      - "installer/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYVER: "3.12.10"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYVER }}

      - name: Python embebido + librerías
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist\app | Out-Null
          Invoke-WebRequest "https://www.python.org/ftp/python/$env:PYVER/python-$env:PYVER-embed-amd64.zip" -OutFile py.zip
          Expand-Archive py.zip -DestinationPath dist\app\python
          $pth = Get-ChildItem dist\app\python\python*._pth | Select-Object -First 1
          $lines = (Get-Content $pth) -replace '^#\s*import site', 'import site'
          $lines += 'Lib\site-packages'
          Set-Content $pth $lines
          Get-Content $pth
          python -m pip install --upgrade pip
          python -m pip install -r pc\requirements.txt pip --target dist\app\python\Lib\site-packages --no-warn-script-location
          Invoke-WebRequest "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile dist\vc_redist.x64.exe

      - name: Código y versión
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item -Recurse pc dist\app\pc
          Copy-Item -Recurse tools dist\app\tools
          Remove-Item dist\app\pc\simular_iphone.py, dist\app\pc\*.bat -ErrorAction SilentlyContinue
          Remove-Item -Recurse dist\app\pc\pruebas -ErrorAction SilentlyContinue
          $req = (python -c "import hashlib;print(hashlib.sha256(open('pc/requirements.txt','rb').read()).hexdigest()[:16])").Trim()
          $ver = @{ pc = [int]"${{ github.run_number }}"; req = $req } | ConvertTo-Json -Compress
          Set-Content -Encoding utf8NoBOM dist\app\version.json $ver
          Copy-Item dist\app\version.json dist\version.json
          Get-Content dist\version.json

      - name: Prueba del visor (navegador simulado)
        shell: pwsh
        run: |
          cd pc\pruebas
          npm install --silent --no-audit --no-fund
          node visor_prueba.mjs ..\web\visor.html
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Prueba de importación con el Python embebido
        shell: pwsh
        run: |
          dist\app\python\python.exe -I -c "import open3d, numpy, cv2, aiohttp, zeroconf, pye57, trimesh, scipy, PIL; from pxr import Usd, UsdUtils; print('open3d', open3d.__version__, 'numpy', numpy.__version__)"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Prueba de punta a punta (iPhone simulado)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $py = "dist\app\python\python.exe"
          $srv = Start-Process $py -ArgumentList "-I", "dist\app\pc\servidor_levanta.py", "--carpeta", "$PWD\prueba" -PassThru -RedirectStandardOutput srv.log -RedirectStandardError srv.err
          for ($i = 0; $i -lt 60; $i++) { try { Invoke-RestMethod http://localhost:8765/estado | Out-Null; break } catch { Start-Sleep 2 } }
          & $py -I tools\sintetico.py --salida sim\paquete --cuadros 60
          & $py -I pc\simular_iphone.py sim\paquete --fps 15
          $ok = $false
          for ($i = 0; $i -lt 480; $i++) {
            $s = Invoke-RestMethod http://localhost:8765/estado
            if (-not $s.procesando -and ($s.resultados.Count -gt 0 -or $s.mensaje -like "*falló*")) { $ok = $s.resultados.Count -gt 0; break }
            Start-Sleep 5
          }
          Get-Content srv.log -Tail 25
          $res = "prueba\RGBD_prueba_simulada\resultado"
          Get-ChildItem $res | Format-Table Name, Length
          # al terminar solo queda el FBX (Navisworks) con sus texturas; todo lo demás se borra
          if (-not (Test-Path "$res\obj\modelo_navisworks.fbx")) { Write-Error "Falta obj\modelo_navisworks.fbx" }
          if (-not (Test-Path "$res\obj\textura_0.jpg")) { Write-Error "Faltan las texturas" }
          if (-not (Test-Path "$res\modelo_texturizado.usdz")) { Write-Error "Falta el USDZ ligero para el iPhone" }
          foreach ($f in "modelo_texturizado.glb", "reporte.txt", "poses_corregidas.json", "modelo_solidworks.3mf", "nube_fusionada.e57", "malla_solidworks.stl", "obj\modelo_texturizado.obj") {
            if (Test-Path "$res\$f") { Write-Error "Sobra $f (ya no se debe crear)" }
          }
          Stop-Process -Id $srv.Id -Force
          if (-not $ok) { Get-Content srv.err -Tail 40; exit 1 }

      - name: Compilar instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DMyVersion=${{ github.run_number }}" installer\levantamiento.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist\Levantamiento3D_Setup.exe | Format-Table Name, Length

      - name: Probar el instalador (instalación silenciosa y arranque)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $p = Start-Process dist\Levantamiento3D_Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=C:\L3D", "/LOG=install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 40; exit 1 }
          Start-Process C:\L3D\python\pythonw.exe -ArgumentList "-I", "C:\L3D\pc\lanzador.py", "--sin-ventana", "--carpeta", "$PWD\prueba2"
          $up = $false
          for ($i = 0; $i -lt 60; $i++) { try { $e = Invoke-RestMethod http://localhost:8765/estado; $up = $true; break } catch { Start-Sleep 2 } }
          if (-not $up) { Get-Content "$PWD\prueba2\registro.txt" -ErrorAction SilentlyContinue; exit 1 }
          Invoke-RestMethod http://localhost:8765/api/version
          netsh advfirewall firewall show rule name="Levantamiento 3D" | Select-String "Puerto|Port|Programa|Program" | Select-Object -First 6
          # borrar un escaneo desde el programa: debe irse a la Papelera de reciclaje
          New-Item -ItemType Directory -Force "$PWD\prueba2\RGBD_borrar_prueba" | Out-Null
          Set-Content "$PWD\prueba2\RGBD_borrar_prueba\frames.jsonl" '{"i":0}'
          $b = curl.exe -s -H "X-Levanta: 1" -H "Content-Type: application/json" -d '{"carpeta":"RGBD_borrar_prueba"}' http://localhost:8765/api/borrar | ConvertFrom-Json
          "Borrar: ok=$($b.ok) papelera=$($b.papelera) $($b.mensaje)"
          if (-not $b.ok -or (Test-Path "$PWD\prueba2\RGBD_borrar_prueba")) { exit 1 }

      - name: Probar actualización desde archivo (librería nueva, sin internet)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force t\pkg\wheels | Out-Null
          Copy-Item -Recurse dist\app\pc t\pkg\pc
          Copy-Item -Recurse dist\app\tools t\pkg\tools
          Add-Content t\pkg\pc\requirements.txt "tabulate==0.9.0"
          Set-Content -Encoding utf8NoBOM t\pkg\version.json '{"pc": 9999, "req": "prueba"}'
          python -m pip download tabulate==0.9.0 pip -d t\pkg\wheels --only-binary=:all: --quiet
          Compress-Archive -Path t\pkg\* -DestinationPath t\actualizacion_prueba.zip
          $v = curl.exe -s -H "X-Levanta: 1" -F "archivo=@t\actualizacion_prueba.zip" http://localhost:8765/api/archivo/validar | ConvertFrom-Json
          "Validación: puede=$($v.puede) faltan=$($v.faltan -join ', ') ruedas=$($v.ruedas) $($v.motivo)"
          if (-not $v.puede -or $v.faltan.Count -ne 1) { exit 1 }
          $r = curl.exe -s -H "X-Levanta: 1" -H "Content-Type: application/json" -d "{`"token`":`"$($v.token)`"}" http://localhost:8765/api/archivo/instalar | ConvertFrom-Json
          "Instalar: $($r.mensaje)"
          Start-Sleep 6
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            try { $ver = Invoke-RestMethod http://localhost:8765/api/version; if ($ver.pc -eq 9999) { $ok = $true; break } } catch {}
            Start-Sleep 2
          }
          Invoke-RestMethod http://localhost:8765/api/ultima | Format-List
          Get-Content "$PWD\prueba2\registro.txt" -Tail 15
          if (-not $ok) { exit 1 }
          C:\L3D\python\python.exe -I -c "import tabulate; print('tabulate', tabulate.__version__, 'instalada desde el paquete')"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Paquete de actualización
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force upd | Out-Null
          Copy-Item -Recurse dist\app\pc upd\pc
          Copy-Item -Recurse dist\app\tools upd\tools
          Copy-Item dist\version.json upd\version.json
          Get-ChildItem upd -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          # si cambiaron las librerías respecto a la versión publicada anterior, el paquete las incluye
          $prevReq = ""
          try {
            $rels = Invoke-RestMethod "https://api.github.com/repos/${{ github.repository }}/releases?per_page=40"
            $prev = $rels | Where-Object { $_.tag_name -like "pc-*" } | Sort-Object { [int]($_.tag_name -replace 'pc-','') } -Descending | Select-Object -First 1
            $asset = $prev.assets | Where-Object { $_.name -eq "version.json" } | Select-Object -First 1
            if ($asset) { $prevReq = (Invoke-RestMethod $asset.browser_download_url).req }
          } catch {}
          $req = (Get-Content dist\version.json | ConvertFrom-Json).req
          "Requisitos: anterior=$prevReq actual=$req"
          $items = @("upd\pc", "upd\tools", "upd\version.json")
          if ($prevReq -ne $req) {
            python -m pip download -r pc\requirements.txt pip -d upd\wheels --only-binary=:all: --quiet
            $items += "upd\wheels"
          }
          Compress-Archive -Path $items -DestinationPath dist\actualizacion_pc.zip
          Get-ChildItem dist\actualizacion_pc.zip | Format-Table Name, Length

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-${{ github.run_number }}
          name: Programa PC ${{ github.run_number }}
          body: "Levantamiento 3D para Windows. Instala con Levantamiento3D_Setup.exe; las siguientes versiones se aplican desde la pestaña Actualizaciones del programa."
          files: |
            dist/Levantamiento3D_Setup.exe
            dist/actualizacion_pc.zip
            dist/version.json
